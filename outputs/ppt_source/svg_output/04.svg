<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" lang="zh-CN" font-family="Microsoft YaHei, Arial, PingFang SC, sans-serif" font-size="28" data-pptx-page-role="content">
  <rect x="0" y="0" width="1280" height="720" fill="#0E2438"/>
  <rect x="0" y="0" width="1280" height="8" fill="#2A9D8F"/>
  <g id="header" data-pptx-bounds="64 40 1152 52" data-pptx-role="header">
    <text x="64" y="84" font-size="16" fill="#4ECDB4" letter-spacing="2">03 / 架构</text>
    <text x="1216" y="84" font-size="14" fill="#7F9AAA" text-anchor="end" letter-spacing="2">FROM ONE SENTENCE TO A RESULT</text>
  </g>
  <g id="body" data-pptx-bounds="64 120 1152 500">
    <text x="64" y="174" font-size="44" font-weight="bold" fill="#FFFFFF">一次核算，五个动作</text>
    <text x="64" y="214" font-size="21" fill="#B9CED8">从一句话到一份可追溯的结果，路径固定、可审计。</text>
    <g id="step-1">
      <rect x="64" y="250" width="208" height="112" rx="8" fill="#173B52" stroke="#2A4A60" stroke-width="2"/>
      <text x="82" y="280" font-size="15" fill="#4ECDB4">01</text>
      <text x="82" y="314" font-size="21" font-weight="bold" fill="#FFFFFF">识别意图</text>
      <text x="82" y="342" font-size="15" fill="#B9CED8">单日 / 全年 / 敏感性</text>
    </g>
    <g id="step-2">
      <rect x="296" y="250" width="208" height="112" rx="8" fill="#173B52" stroke="#2A4A60" stroke-width="2"/>
      <text x="314" y="280" font-size="15" fill="#4ECDB4">02</text>
      <text x="314" y="314" font-size="21" font-weight="bold" fill="#FFFFFF">追问参数</text>
      <text x="314" y="342" font-size="15" fill="#B9CED8">缺什么问什么</text>
    </g>
    <g id="step-3">
      <rect x="528" y="250" width="208" height="112" rx="8" fill="#173B52" stroke="#2A4A60" stroke-width="2"/>
      <text x="546" y="280" font-size="15" fill="#4ECDB4">03</text>
      <text x="546" y="314" font-size="21" font-weight="bold" fill="#FFFFFF">调用工具</text>
      <text x="546" y="342" font-size="15" fill="#B9CED8">确定性计算</text>
    </g>
    <g id="step-4">
      <rect x="760" y="250" width="208" height="112" rx="8" fill="#173B52" stroke="#2A4A60" stroke-width="2"/>
      <text x="778" y="280" font-size="15" fill="#4ECDB4">04</text>
      <text x="778" y="314" font-size="21" font-weight="bold" fill="#FFFFFF">解释结果</text>
      <text x="778" y="342" font-size="15" fill="#B9CED8">逐时功率与排放差</text>
    </g>
    <g id="step-5">
      <rect x="992" y="250" width="208" height="112" rx="8" fill="#173B52" stroke="#2A4A60" stroke-width="2"/>
      <text x="1010" y="280" font-size="15" fill="#4ECDB4">05</text>
      <text x="1010" y="314" font-size="21" font-weight="bold" fill="#FFFFFF">生成报告</text>
      <text x="1010" y="342" font-size="15" fill="#B9CED8">Markdown / HTML</text>
    </g>
    <g id="panel-input">
      <rect x="64" y="392" width="330" height="190" rx="8" fill="#123047" stroke="#2A4A60" stroke-width="2"/>
      <text x="88" y="430" font-size="16" fill="#4ECDB4">输入</text>
      <text x="88" y="468" font-size="17" fill="#D5E4EC">24 点负荷 / 水 / 风 / 光</text>
      <text x="88" y="500" font-size="17" fill="#D5E4EC">25 点 SOC（可选）</text>
      <text x="88" y="532" font-size="17" fill="#D5E4EC">装机、效率、死区等参数</text>
    </g>
    <g id="panel-core">
      <rect x="414" y="392" width="452" height="190" rx="8" fill="#123047" stroke="#2A4A60" stroke-width="2"/>
      <text x="438" y="430" font-size="16" fill="#E9C46A">核心计算</text>
      <text x="438" y="468" font-size="17" fill="#D5E4EC">功率平衡 → SOC 转换</text>
      <text x="438" y="500" font-size="17" fill="#D5E4EC">→ 调峰深度 → 三段煤耗</text>
      <text x="438" y="532" font-size="17" fill="#D5E4EC">→ 两种情景排放差</text>
    </g>
    <g id="panel-output">
      <rect x="886" y="392" width="330" height="190" rx="8" fill="#123047" stroke="#2A4A60" stroke-width="2"/>
      <text x="910" y="430" font-size="16" fill="#E76F51">输出</text>
      <text x="910" y="468" font-size="17" fill="#D5E4EC">逐时功率 / 两种情景排放</text>
      <text x="910" y="500" font-size="17" fill="#D5E4EC">减碳量 / 减排率</text>
      <text x="910" y="532" font-size="17" fill="#D5E4EC">警告与边界说明</text>
    </g>
    <text x="64" y="622" font-size="18" fill="#E9C46A">缺参数先追问；没有 SOC 时用启发式，并标注“非最优”。</text>
  </g>
  <g id="footer" data-pptx-bounds="64 660 1152 30" data-pptx-role="footer">
    <text x="64" y="682" font-size="14" fill="#7F9AAA">蓄能碳效参谋 · 实践报告</text>
    <text x="1216" y="682" font-size="14" fill="#7F9AAA" text-anchor="end">04 / 10</text>
  </g>
</svg>
